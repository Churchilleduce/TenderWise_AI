[project]
name = "tenderwiseai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "churchilleduce", email = "churchilleduce@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "gradio>=6.32.0",
    "ipykernel>=7.4.0",
    "openai-agents>=0.26.0",
    "pydantic>=2.14.4",
    "pymupdf>=2.1",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
tenderwiseai = "tenderwiseai:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
